<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="12" fill="#F5F0E8"/>
  <text x="200" y="30" text-anchor="middle" font-family="serif" font-size="18" fill="#8B7355">第四步 · 雕刻</text>
  <!-- 葫芦本体 -->
  <ellipse cx="200" cy="170" rx="55" ry="75" fill="#F0E6D0" stroke="#C5A55A" stroke-width="1.5"/>
  <ellipse cx="200" cy="100" rx="25" ry="30" fill="#F0E6D0" stroke="#C5A55A" stroke-width="1.5"/>
  <line x1="200" y1="70" x2="200" y2="55" stroke="#A0896C" stroke-width="3" stroke-linecap="round"/>
  <!-- 浮雕纹样（更深的线条） -->
  <path d="M170 140 Q185 120 200 140 Q215 120 230 140" stroke="#8B7355" stroke-width="2" fill="none"/>
  <path d="M165 160 Q200 140 235 160" stroke="#8B7355" stroke-width="2" fill="none"/>
  <path d="M175 180 Q200 165 225 180" stroke="#8B7355" stroke-width="1.5" fill="none"/>
  <!-- 刻刀 -->
  <line x1="280" y1="120" x2="310" y2="150" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <polygon points="310,150 305,158 315,155" fill="#AAA"/>
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#A0896C">平刀圆刀斜口刀 · 稳准轻快</text>
</svg>
