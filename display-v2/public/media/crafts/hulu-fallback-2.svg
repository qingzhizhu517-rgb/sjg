<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="12" fill="#F5F0E8"/>
  <text x="200" y="30" text-anchor="middle" font-family="serif" font-size="18" fill="#8B7355">第二步 · 去皮晾晒</text>
  <!-- 去皮后的葫芦 -->
  <ellipse cx="200" cy="170" rx="55" ry="75" fill="#F0E6D0" stroke="#C5A55A" stroke-width="1.5"/>
  <ellipse cx="200" cy="100" rx="25" ry="30" fill="#F0E6D0" stroke="#C5A55A" stroke-width="1.5"/>
  <line x1="200" y1="70" x2="200" y2="55" stroke="#A0896C" stroke-width="3" stroke-linecap="round"/>
  <!-- 飘落的皮屑 -->
  <path d="M130 120 Q135 115 140 125" stroke="#8DB36B" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M270 140 Q275 132 278 145" stroke="#8DB36B" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M150 200 Q155 193 158 205" stroke="#8DB36B" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#A0896C">刮去青皮 · 阴凉通风处晾晒月余</text>
</svg>
