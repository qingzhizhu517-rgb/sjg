groups:
  - name: sjg
    rules:
      - alert: SjgHighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { summary: 'SJG 服务错误率超过 5%' }
      - alert: SjgDatabasePoolSaturation
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'SJG 数据库连接池持续饱和' }
      - alert: SjgAuthenticationFailures
        expr: sum(increase(sjg_auth_attempts_total{outcome=~"failed|limited"}[5m])) > 20
        for: 2m
        labels: { severity: warning }
        annotations: { summary: 'SJG 认证失败或限流异常增加' }
