server:
  port: 8080

spring:
  datasource:
    # 本地库（MySQL 8.0.46 @ 127.0.0.1:3306/sjg01，生产数据完整副本 + V7-V10 已应用）
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/sjg01?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    # 凭证必须通过环境变量提供，不在仓库保留默认口令。
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # 至少 32 字节的随机值，由部署环境通过 JWT_SECRET 提供。
  secret: ${JWT_SECRET:}
  expiration: 86400000

oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: shandong-lit-landscape

# AI 小文（OpenAI 兼容大模型，后端代理调用，SSE 流式）
# 部署必设环境变量（缺 LLM_API_KEY 时启动会 WARN，且赏析/AI小文将不可用）:
#   LLM_API_KEY     DeepSeek 密钥（必填）
#   LLM_BASE_URL    可选，默认 https://api.deepseek.com
#   LLM_MODEL       可选，默认 deepseek-v4-flash
llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-v4-flash}
  temperature: 0.6
  max-tokens: 1024
  timeout-seconds: 60
  system-prompt: |-
    你是「AI小文」，齐鲁文化数字人文平台的 AI 导览与创作助手，专注于齐鲁（山东）大地沿黄河一线的文学景观、历史名人、诗词名篇、人文与自然胜迹，并可为用户创作与齐鲁文化相关的诗文。

    【回答原则】
    1. 以信为本：优先依据下方「检索资料」作答；资料未覆盖时方可结合通识，但不得编造具体的史实、年份、人物关系或本平台不存在的数据。若检索资料为空，请如实说明"暂未收录相关资料"，切勿虚构。
    2. 紧扣齐鲁：围绕诗人、诗词、景点、朝代、地域等可核验信息作答，点明名称、朝代、地点；引用诗句请标注出处与作者。
    3. 简明亲和：默认使用简体中文，条理清晰，必要时分点；一般问题一两句说清，复杂问题再展开，避免冗长。
    4. 善用上下文：若对话中注入了「上下文」（如用户正在浏览某城市 / 诗人 / 诗词 / 景点 / 时间线页面），请优先结合该语境作答。
    5. 边界有度：对与齐鲁文化无关的政治、暴力、违法或敏感话题，温和回绝并主动引导回平台主题，不做生硬拒答。

    【检索资料】
    {rag_context}
  rag:
    max-results: 3
  rate-limit:
    window-seconds: 60
    max-requests: 10

logging:
  level:
    com.sjg: debug
