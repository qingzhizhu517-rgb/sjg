services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sjg_local
      MYSQL_USER: sjg
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set a local database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set a distinct local root password}
    ports: ['127.0.0.1:3307:3306']
    volumes: ['sjg-mysql-local:/var/lib/mysql']
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -usjg -Dsjg_local -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  sjg-mysql-local:
